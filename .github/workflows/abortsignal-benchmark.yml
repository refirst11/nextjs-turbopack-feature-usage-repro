name: abortsignal-benchmark

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Number of runs per arm
        required: false
        default: "6"
  push:
    branches: ["probe/**"]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "25"]

    name: node@${{ matrix.node }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Check telemetry is enabled
        run: node node_modules/next/dist/bin/next telemetry status

      - name: Snapshot the released dist
        run: node scripts/dist-snapshot.mjs save

      # Four builds of the same project, differing only in which patches are
      # applied. Every arm starts from the restored release.
      - name: Arm 1 — released build
        env:
          RUNS: ${{ inputs.runs || '6' }}
        run: |
          pnpm benchmark
          mv benchmark-results.json stock.json

      - name: Arm 2 — native AbortController only
        env:
          RUNS: ${{ inputs.runs || '6' }}
        run: |
          node scripts/dist-snapshot.mjs restore
          node scripts/patch-abortsignal.mjs
          pnpm benchmark
          mv benchmark-results.json signal.json

      - name: Arm 3 — PR #97981 only
        env:
          RUNS: ${{ inputs.runs || '6' }}
        run: |
          node scripts/dist-snapshot.mjs restore
          node scripts/patch-pr97981.mjs
          pnpm benchmark
          mv benchmark-results.json pr.json

      - name: Arm 4 — PR #97981 and native AbortController
        env:
          RUNS: ${{ inputs.runs || '6' }}
        run: |
          node scripts/dist-snapshot.mjs restore
          node scripts/patch-pr97981.mjs
          node scripts/patch-abortsignal.mjs
          pnpm benchmark
          mv benchmark-results.json both.json

      - name: Compare
        run: |
          node scripts/compare-benchmarks.mjs \
            "released=stock.json" \
            "native AbortController=signal.json" \
            "PR #97981=pr.json" \
            "PR #97981 + native AbortController=both.json"
